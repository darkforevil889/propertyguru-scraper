name: Scrape PropertyGuru

on:
  schedule:
    - cron: "0 0 * * *"   # daily 00:00 UTC = 8:00 AM Malaysia time
  workflow_dispatch:       # "Run workflow" button in the Actions tab
    inputs:
      pages:
        description: "Max search pages (0 = all)"
        default: "0"
      max_details:
        description: "Max listing pages to open this run (0 = no limit)"
        default: "1500"
      details:
        description: "Open listing pages too? (Cloudflare blocks these on GitHub's servers)"
        type: boolean
        default: false

concurrency:
  group: scrape        # never run two scrapes at once
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 345  # GitHub's hard limit is 6 hours
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Check Chrome
        run: google-chrome --version   # Chrome comes preinstalled on GitHub's Ubuntu runners

      - name: Scrape
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PYTHONUNBUFFERED: "1"
        # xvfb-run gives Chrome a virtual screen, so it runs "visible" like on your PC
        run: >
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24"
          python scraper.py
          --pages ${{ inputs.pages || '0' }}
          --max-details ${{ inputs.max_details || '1500' }}
          --challenge-wait 30
          ${{ inputs.details != true && '--no-details' || '' }}

      - name: Save screenshots of failed pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug/
          if-no-files-found: ignore
          retention-days: 7
